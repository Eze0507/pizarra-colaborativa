<!-- ================================================================= -->
<!-- PÍLDORA FLOTANTE INFERIOR CENTRAL DE INSTRUCCIONES IA (VOZ/TEXTO) -->
<!-- ================================================================= -->
<div class="pildora-ia-wrapper" [class.modo-oscuro]="modoOscuro">
  <div
    class="pildora-ia-bar"
    [class.pildora-grabando]="escuchandoMicrofono"
    [class.pildora-procesando]="cargandoInstruccion"
    role="region"
    aria-label="Barra de instrucciones rápidas con IA"
  >
    <button id="btn-deshacer-lienzo" type="button" class="btn-historial" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"
      [disabled]="!habilitado || historialEnProceso || (!history.canUndo && !cargandoInstruccion)"
      (click)="history.execute({ action: 'undo' })">↶</button>
    <button id="btn-rehacer-lienzo" type="button" class="btn-historial" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"
      [disabled]="!habilitado || historialEnProceso || !history.canRedo"
      (click)="history.execute({ action: 'redo' })">↷</button>
    <!-- ESTADO 1: PROCESANDO INSTRUCCIÓN (Muestra spinner + el mensaje dicho/escrito) -->
    <div *ngIf="cargandoInstruccion" class="pildora-estado-procesando">
      <div class="pildora-spinner"></div>
      <span class="procesando-badge">Procesando</span>
      <span class="procesando-mensaje" [title]="instruccionEnProceso">
        «{{ instruccionEnProceso }}»
      </span>
    </div>

    <!-- ESTADO 2: DISPONIBLE / ESCUCHANDO (Solo micrófono + input + botón enviar) -->
    <ng-container *ngIf="!cargandoInstruccion">
      <!-- Botón de Micrófono -->
      <button
        id="btn-microfono-ia"
        type="button"
        class="btn-pildora-mic"
        [class.mic-activo]="escuchandoMicrofono"
        (click)="alternarMicrofono()"
        [title]="escuchandoMicrofono ? 'Detener y enviar instrucción' : 'Dictar instrucción por voz (o mantén presionado Espacio)'"
        aria-label="Dictar instrucción por voz"
      >
        <span *ngIf="escuchandoMicrofono" class="mic-pulso-anillo"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>

      <!-- Input para escribir o visualizar dictado en vivo -->
      <input
        id="input-instruccion-ia"
        #instruccionInput
        type="text"
        class="input-pildora-ia"
        [(ngModel)]="textoInstruccion"
        [placeholder]="escuchandoMicrofono ? 'Escuchando instrucción... (suelta Espacio o pulsa enviar)' : 'Escribe una instrucción para el lienzo o usa el micrófono...'"
        (keydown.enter)="onEnterInput($event)"
        autocomplete="off"
        [disabled]="!habilitado || historialEnProceso"
      />

      <!-- Botón Enviar -->
      <button
        id="btn-enviar-instruccion-ia"
        type="button"
        class="btn-pildora-enviar"
        (click)="escuchandoMicrofono ? detenerMicrofonoYEnviar() : enviarInstruccion()"
        [disabled]="!textoInstruccion.trim() && !escuchandoMicrofono"
        title="Ejecutar instrucción"
        aria-label="Ejecutar instrucción"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </ng-container>
  </div>
  <div *ngIf="historialEnProceso || mensajeHistorial" class="mensaje-historial" role="status" aria-live="polite">
    {{ historialEnProceso ? 'Esperando confirmación del diagrama…' : mensajeHistorial }}
  </div>
</div>
