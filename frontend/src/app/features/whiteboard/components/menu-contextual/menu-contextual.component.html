<ng-container *ngIf="visible">
  <div class="menu-contextual-backdrop" (click)="onCancelar()"></div>
  <div
    class="menu-contextual-flotante"
    [style.left.px]="posicion.x"
    [style.top.px]="posicion.y"
  >
  <div class="menu-contextual-header">
    <div class="menu-contextual-header-info">
      <span class="badge-tipo" [class.badge-relacion]="tipo === 'relacion'">
        {{ tipo === 'entidad' ? 'Entidad' : 'Relación' }}
      </span>
      <span class="menu-contextual-titulo" [title]="titulo">{{ titulo }}</span>
    </div>
    <button
      type="button"
      class="btn-cerrar-contextual"
      (click)="onCancelar()"
      title="Cerrar (Esc)"
    >
      ✕
    </button>
  </div>

  <div class="menu-contextual-acciones">
    <!-- Opción 1: Propiedades -->
    <button
      type="button"
      class="accion-btn btn-propiedades"
      (click)="onPropiedades()"
    >
      <div class="accion-icono icono-propiedades">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
      <div class="accion-texto">
        <span class="accion-nombre">Propiedades</span>
        <span class="accion-desc">
          {{ tipo === 'entidad' ? 'Editar atributos y configuración' : 'Editar nombre y cardinalidades' }}
        </span>
      </div>
    </button>

    <!-- Opción 2: Agregar etiqueta o nombre de la relación (Solo para relaciones) -->
    <button
      *ngIf="tipo === 'relacion'"
      type="button"
      class="accion-btn btn-etiqueta"
      (click)="onAgregarEtiqueta()"
    >
      <div class="accion-icono icono-etiqueta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
          <line x1="7" y1="7" x2="7.01" y2="7"></line>
        </svg>
      </div>
      <div class="accion-texto">
        <span class="accion-nombre">Agregar etiqueta o nombre de la relación</span>
        <span class="accion-desc">Escribir nombre o verbo en la línea</span>
      </div>
    </button>

    <!-- Opción 3: Eliminar (con expansión y confirmación en 2 pasos) -->
    <button
      type="button"
      class="accion-btn btn-eliminar"
      [class.modo-confirmar]="confirmandoEliminar"
      (click)="onEliminar()"
    >
      <div class="accion-icono icono-eliminar">
        <svg *ngIf="!confirmandoEliminar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
        <svg *ngIf="confirmandoEliminar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <div class="accion-texto">
        <span class="accion-nombre" *ngIf="!confirmandoEliminar">Eliminar</span>
        <span class="accion-nombre texto-alerta" *ngIf="confirmandoEliminar">Haz clic de nuevo para confirmar</span>
        <span class="accion-desc" *ngIf="!confirmandoEliminar">Quitar del diagrama</span>
        <span class="accion-desc desc-alerta" *ngIf="confirmandoEliminar">Esta acción no se puede deshacer</span>
      </div>
    </button>
  </div>
</div>
</ng-container>
