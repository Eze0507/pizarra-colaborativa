<div
  *ngIf="visible"
  class="menu-relacion-flotante"
  [style.left.px]="posicion.x"
  [style.top.px]="posicion.y"
>
  <div class="menu-relacion-header">
    <span class="menu-relacion-titulo">Relación UML</span>
    <button
      type="button"
      class="btn-cerrar-menu-relacion"
      (click)="onCancelar()"
      title="Cancelar (Esc)"
    >
      ✕
    </button>
  </div>

  <div class="menu-relacion-items">
    <button
      *ngFor="let opt of opciones"
      type="button"
      class="opcion-relacion-btn"
      (click)="onSeleccionar(opt.tipo)"
    >
      <div class="opcion-relacion-icono" [attr.data-tipo]="opt.tipo">
        <svg *ngIf="opt.svgIcon === 'asociacion'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
        </svg>
        <svg *ngIf="opt.svgIcon === 'agregacion'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="6 12 12 6 18 12 12 18" fill="none"></polygon>
          <line x1="18" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
        </svg>
        <svg *ngIf="opt.svgIcon === 'composicion'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="6 12 12 6 18 12 12 18" fill="currentColor"></polygon>
          <line x1="18" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
        </svg>
        <svg *ngIf="opt.svgIcon === 'herencia'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="14" y2="12"></line>
          <polygon points="14 7 21 12 14 17" fill="none"></polygon>
        </svg>
        <svg *ngIf="opt.svgIcon === 'clase_asociacion'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="3" width="7" height="6" rx="1"></rect>
          <rect x="15" y="3" width="7" height="6" rx="1"></rect>
          <rect x="7" y="15" width="10" height="7" rx="1" stroke-dasharray="2 1"></rect>
          <line x1="9" y1="6" x2="15" y2="6"></line>
          <line x1="12" y1="6" x2="12" y2="15" stroke-dasharray="2 2"></line>
        </svg>
      </div>

      <div class="opcion-relacion-info">
        <span class="opcion-relacion-nombre">{{ opt.nombre }}</span>
        <span class="opcion-relacion-subtitulo">{{ opt.subtitulo }}</span>
      </div>
    </button>
  </div>

  <div class="menu-relacion-footer">
    <button type="button" class="btn-cancelar-relacion" (click)="onCancelar()">
      Cancelar
    </button>
  </div>
</div>
