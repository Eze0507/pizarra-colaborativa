<div *ngIf="visible" class="spring-modal-backdrop" role="presentation" (click)="!generando && cerrar.emit()">
  <section class="spring-modal" role="dialog" aria-modal="true" aria-labelledby="spring-modal-title" (click)="$event.stopPropagation()">
    <header>
      <div>
        <h2 id="spring-modal-title">Generación Java</h2>
        <p>Genera y descarga un proyecto Spring Boot desde la revisión confirmada.</p>
      </div>
      <button id="btn-cerrar-modal-spring" type="button" class="close" [disabled]="generando" (click)="cerrar.emit()" aria-label="Cerrar">×</button>
    </header>

    <div class="spring-form">
      <label>
        Nombre del proyecto
        <input id="input-nombre-proyecto-spring" name="springProjectName" [(ngModel)]="nombreProyecto" (blur)="normalizarNombreProyecto()" maxlength="64" autocomplete="off" placeholder="tienda" />
      </label>
      <small class="field-error" *ngIf="errorNombre">{{ errorNombre }}</small>

      <label>
        Paquete base Java
        <input id="input-paquete-base-spring" name="springBasePackage" [(ngModel)]="paqueteBase" maxlength="200" autocomplete="off" placeholder="com.ejemplo.tienda" />
      </label>
      <small class="field-error" *ngIf="errorPaquete">{{ errorPaquete }}</small>

      <section class="advanced-section">
        <button
          id="btn-toggle-opciones-avanzadas-spring"
          type="button"
          class="advanced-toggle"
          [attr.aria-expanded]="opcionesAvanzadasAbiertas"
          aria-controls="spring-advanced-options"
          (click)="alternarOpcionesAvanzadas()"
        >
          <span class="advanced-title">Opciones avanzadas</span>
          <span class="advanced-summary">{{ resumenCapas }}</span>
          <svg
            class="advanced-chevron"
            [class.open]="opcionesAvanzadasAbiertas"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div
          *ngIf="opcionesAvanzadasAbiertas"
          id="spring-advanced-options"
          class="advanced-panel"
        >
          <fieldset>
            <legend>Capas</legend>
            <label *ngFor="let capa of capas">
              <input
                type="checkbox"
                [checked]="opciones[capa.key]"
                (change)="cambiarOpcion(capa.key, $any($event.target).checked)"
              />
              <span>{{ capa.label }}</span>
            </label>
          </fieldset>
          <small class="option-message" *ngIf="mensajeOpciones">{{ mensajeOpciones }}</small>
        </div>
      </section>

      <div class="blocked" *ngIf="!puedeGenerar && motivoBloqueo" role="status">
        {{ motivoBloqueo }}
        <button id="btn-guardar-ahora-spring" *ngIf="puedeGuardar" type="button" (click)="guardar.emit()">Guardar ahora</button>
      </div>
      <div class="server-error" *ngIf="errorServidor" role="alert">{{ errorServidor }}</div>
    </div>

    <footer>
      <button id="btn-cancelar-generar-spring" type="button" class="secondary" [disabled]="generando" (click)="cerrar.emit()">Cancelar</button>
      <button
        id="btn-confirmar-generar-spring"
        type="button"
        class="primary"
        [disabled]="!formularioValido || !puedeGenerar || generando"
        (click)="enviar()"
      >
        {{ generando ? 'Generando…' : 'Generar y descargar' }}
      </button>
    </footer>
  </section>
</div>
