<div class="whiteboard-root" [class.modo-oscuro]="modoOscuro">

  <!-- Estado: Cargando -->
  <div *ngIf="isLoading" class="loading-overlay">
    <div class="spinner"></div>
    <p class="loading-text">Cargando diagrama...</p>
  </div>

  <!-- Estado: Error -->
  <div *ngIf="!isLoading && errorMessage" class="error-overlay">
    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <p class="error-text">{{ errorMessage }}</p>
    <button type="button" class="btn-volver-error" (click)="onVolverDashboard()">
      Volver al dashboard
    </button>
  </div>

  <div *ngIf="conflictoRevision" class="revision-conflict" role="alert">
    <strong>{{ conflictoRevision.mensaje || 'No se confirmó el cambio del diagrama.' }}</strong>
    <span>Se conservaron tus cambios locales y se suspendió el autoguardado.</span>
    <button type="button" (click)="onRecargarTrasConflicto()">Recuperar estado remoto</button>
  </div>

  <!-- Barra lateral de la pizarra -->
  <app-sidebar-pizarra
    [proyecto]="proyecto"
    [estadoConexion]="estadoConexion"
    [estadoGuardado]="estadoGuardado"
    [modoOscuro]="modoOscuro"
    [usuariosConectados]="usuariosConectados"
    (agregarEntidad)="onAgregarEntidad()"
    (agregarClaseAsociacion)="onAgregarClaseAsociacion()"
    (agregarNota)="onAgregarNota()"
    (renombrarProyecto)="onRenombrarProyecto($event)"
    (abrirColaboradores)="onAbrirColaboradores()"
    (generarCodigo)="onGenerarCodigo()"
    (exportarImagen)="onExportarImagen()"
    (exportarXml)="onExportarXml()"
    (importarXml)="onImportarXml($event)"
    (cerrarSesion)="onCerrarSesion()"
    (volverDashboard)="onVolverDashboard()"
    (toggleTema)="onToggleTema()"
    (diagramaIAGenerado)="onDiagramaIAGenerado($event)"
    (localizarHallazgo)="onLocalizarHallazgo($event)"
  >
  </app-sidebar-pizarra>

  <!-- Lienzo JointJS -->
  <div class="lienzo-wrapper" (contextmenu)="$event.preventDefault()">
    <div 
      #lienzo 
      class="lienzo"
      (dragover)="onDragOverLienzo($event)"
      (drop)="onDropLienzo($event)"
    ></div>

    <!-- Editor inline interactivo sobre la figura seleccionada -->
    <app-editor-inline
      (guardar)="onGuardarEditor($event)"
    >
    </app-editor-inline>

    <!-- Menú contextual flotante de selección de Tipo de Relación UML -->
    <app-menu-relacion
      (seleccionar)="confirmarTipoRelacion($event)"
      (cancelar)="onCancelarTipoRelacion()"
    >
    </app-menu-relacion>

    <!-- Menú flotante de selección de Multiplicidad / Cardinalidad -->
    <app-menu-cardinalidad
      (seleccionar)="seleccionarCardinalidad($event)"
    >
    </app-menu-cardinalidad>

    <!-- Controles flotantes de Zoom y Navegación (Cámara local) -->
    <app-controles-zoom
      [zoomNivel]="zoomNivel"
      (zoomIn)="onZoomIn()"
      (zoomOut)="onZoomOut()"
      (zoomReset)="onZoomReset()"
    >
    </app-controles-zoom>

    <!-- Botón Flotante y Panel Colaborativo del Agente Senior -->
    <app-chat-agente-senior
      [proyectoId]="proyecto?.id || 0"
      [contextoDiagrama]="contextoDiagramaIA"
      [modoOscuro]="modoOscuro"
    >
    </app-chat-agente-senior>

    <!-- Botón Flotante y Panel de Asistente IA (Chat y Voz) -->
    <app-chat-asistente-ia
      *ngIf="puedeEditar"
      [habilitado]="edicionDisponible"
      [contextoDiagrama]="contextoDiagramaIA"
      [modoOscuro]="modoOscuro"
      (ejecutarDeltaIA)="onEjecutarDeltaIA($event)"
    >
    </app-chat-asistente-ia>

    <!-- Menú contextual flotante al hacer doble clic en una Entidad o Relación -->
    <app-menu-contextual
      (propiedades)="onAbrirPropiedadesContextual($event)"
      (agregarEtiqueta)="onAgregarEtiquetaContextual($event)"
      (eliminar)="onEliminarContextual($event)"
    >
    </app-menu-contextual>

    <!-- Modal de Propiedades de Entidad (Atributos, PK, Tipos, Estado) -->
    <app-modal-propiedades-entidad
      [visible]="modalEntidadActivo"
      [entidad]="entidadEditando"
      [clasificadores]="clasificadoresModal"
      (guardar)="onGuardarPropiedadesEntidad($event)"
      (cancelar)="onCancelarModalEntidad()"
    >
    </app-modal-propiedades-entidad>

    <!-- Modal de Propiedades de Relación (Nombre/Rol, Cardinalidades UML) -->
    <app-modal-propiedades-relacion
      [visible]="modalRelacionActivo"
      [relacion]="relacionEditando"
      [nombreOrigen]="relacionNombreOrigen"
      [nombreDestino]="relacionNombreDestino"
      (guardar)="onGuardarPropiedadesRelacion($event)"
      (cancelar)="onCancelarModalRelacion()"
      (eliminar)="onEliminarRelacionDesdeModal($event)"
    >
    </app-modal-propiedades-relacion>

    <!-- Modal de Gestión de Colaboradores del Proyecto -->
    <app-modal-colaboradores
      [visible]="modalColaboradoresActivo"
      [proyectoId]="proyecto?.id || 0"
      [esPropietario]="proyecto?.es_propietario || false"
      [modoOscuro]="modoOscuro"
      (cerrar)="onCerrarColaboradores()"
    >
    </app-modal-colaboradores>

    <app-modal-generacion-spring
      [visible]="modalGeneracionActivo"
      [generando]="generandoSpring"
      [puedeGenerar]="puedeGenerarSpring"
      [puedeGuardar]="puedeEditar && estadoGuardado === 'error' && !conflictoRevision && estadoConexion === 'conectado'"
      [motivoBloqueo]="motivoBloqueoGeneracion"
      [nombreInicial]="nombreInicialGeneracion"
      [paqueteInicial]="paqueteInicialGeneracion"
      [errorServidor]="errorGeneracionSpring"
      (cerrar)="onCerrarGeneracion()"
      (guardar)="onGuardarAntesDeGenerar()"
      (generar)="onSolicitarGeneracion($event)"
    >
    </app-modal-generacion-spring>

    <!-- Notificaciones Toast Flotantes -->
    <app-toast-container></app-toast-container>
  </div>
</div>
