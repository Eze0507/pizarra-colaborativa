<div *ngIf="isOpen" class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title-group">
        <h2 class="modal-title">Nuevo Proyecto</h2>
        <p class="modal-subtitle">Crea un espacio colaborativo para el diseño conceptual de tu base de datos</p>
      </div>
      <button type="button" class="btn-close" (click)="close()" [disabled]="isSubmitting" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="modal-form" novalidate>
      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="nombre" class="form-label">Nombre del proyecto <span class="required">*</span></label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          class="form-input"
          [class.input-error]="isFieldInvalid('nombre')"
          placeholder="Ej. Sistema de Facturación Electrónica"
          autocomplete="off"
        />
        <div *ngIf="isFieldInvalid('nombre')" class="field-error">
          <span *ngIf="projectForm.get('nombre')?.errors?.['required']">El nombre del proyecto es obligatorio.</span>
          <span *ngIf="projectForm.get('nombre')?.errors?.['minlength']">Debe tener al menos 3 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="descripcion" class="form-label">Descripción <span class="optional">(Opcional)</span></label>
        <textarea
          id="descripcion"
          formControlName="descripcion"
          class="form-textarea"
          rows="3"
          placeholder="Describe brevemente el alcance del modelo de datos..."
        ></textarea>
      </div>

      <div class="modal-footer">
        <app-custom-button
          type="button"
          variant="secondary"
          text="Cancelar"
          (btnClick)="close()"
          [disabled]="isSubmitting"
        ></app-custom-button>
        <app-custom-button
          type="submit"
          variant="primary"
          text="Crear proyecto"
          loadingText="Creando proyecto..."
          [loading]="isSubmitting"
          [disabled]="isSubmitting"
        ></app-custom-button>
      </div>
    </form>
  </div>
</div>
