<div class="toast-container" *ngIf="(toasts$ | async) as toasts">
  <div
    *ngFor="let toast of toasts; trackBy: trackByToastId"
    class="toast-item"
    [ngClass]="'toast-' + toast.tipo"
  >
    <!-- Icono Éxito -->
    <div *ngIf="toast.tipo === 'exito'" class="toast-icono icono-exito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>

    <!-- Icono Error -->
    <div *ngIf="toast.tipo === 'error'" class="toast-icono icono-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </div>

    <!-- Icono Info -->
    <div *ngIf="toast.tipo === 'info'" class="toast-icono icono-info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>

    <div class="toast-mensaje">{{ toast.mensaje }}</div>

    <button type="button" class="btn-cerrar-toast" (click)="cerrar(toast.id)" title="Cerrar">
      ✕
    </button>
  </div>
</div>
